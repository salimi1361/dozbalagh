<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سامانه دوزبلاغ | کارتابل راننده</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0c4a6e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

    <div id="app" class="app-shell">

        <header class="app-header">
            <div class="app-header__brand">
                <div class="app-header__logo">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
                    </svg>
                </div>
                <div>
                    <div class="app-header__title">سامانه دوزبلاغ</div>
                    <div class="app-header__subtitle">کارتابل رانندگان ترانزیت</div>
                </div>
            </div>
            <div id="connection-status" class="status-pill">متصل</div>
        </header>

        <main id="main-content" class="app-main is-centered"></main>

        <nav id="bottom-navigation" class="bottom-nav hidden">
            <button type="button" onclick="switchTab('home')" id="tab-home" class="bottom-nav__item is-active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>خانه</span>
            </button>
            <button type="button" onclick="switchTab('fleet')" id="tab-fleet" class="bottom-nav__item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
                </svg>
                <span>ناوگان</span>
            </button>
            <button type="button" onclick="switchTab('company')" id="tab-company" class="bottom-nav__item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><line x1="9" y1="22" x2="9" y2="12"/><line x1="15" y1="22" x2="15" y2="12"/><rect x="9" y="12" width="6" height="10"/>
                </svg>
                <span>شرکت</span>
            </button>
            <button type="button" onclick="switchTab('profile')" id="tab-profile" class="bottom-nav__item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <span>پروفایل</span>
            </button>
        </nav>

    </div>

    <div id="toast-container"></div>
    <div id="modal-container"></div>

    <script src="assets/js/app.js"></script>
</body>
</html>
