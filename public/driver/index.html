<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>دوزوله | کارتابل راننده</title>

    <link rel="manifest" href="manifest.json?v=5.7">
    <meta name="theme-color" content="#07111f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="assets/css/app.css?v=5.7">
</head>
<body>

    <div id="app" class="app-shell">

        <header class="app-header">
            <div class="app-header__brand">
                <div class="app-header__logo">
                    <img src="logo.png" alt="انجمن شرکت‌های حمل و نقل بین‌المللی خراسان رضوی">
                </div>
                <div>
                    <div class="app-header__title">سامانه دوزوله</div>
                    <div class="app-header__subtitle">کارتابل رانندگان ترانزیت</div>
                </div>
            </div>
            <div id="connection-status" class="status-pill">متصل</div>
        </header>

        <main id="main-content" class="app-main is-centered">
            <div class="splash-loader">
                <div class="splash-loader__mark">
                    <img src="logo.png" alt="لوگوی انجمن">
                </div>
                <strong>سامانه دوزوله</strong>
                <span>نسخه راننده</span>
            </div>
        </main>

        <nav id="bottom-navigation" class="bottom-nav hidden">
            <button type="button" onclick="switchTab('home')" id="tab-home" class="bottom-nav__item is-active">
                <i class="fa-solid fa-house"></i>
                <span>خانه</span>
            </button>
            <button type="button" onclick="switchTab('messages')" id="tab-messages" class="bottom-nav__item">
                <i class="fa-solid fa-comments"></i>
                <span>پیام‌ها</span>
            </button>
            <button type="button" onclick="switchTab('fleet')" id="tab-fleet" class="bottom-nav__item">
                <i class="fa-solid fa-truck"></i>
                <span>ناوگان</span>
            </button>
            <button type="button" onclick="switchTab('company')" id="tab-company" class="bottom-nav__item">
                <i class="fa-solid fa-building"></i>
                <span>شرکت</span>
            </button>
            <button type="button" onclick="switchTab('profile')" id="tab-profile" class="bottom-nav__item">
                <i class="fa-solid fa-user"></i>
                <span>پروفایل</span>
            </button>
        </nav>

    </div>

    <div id="toast-container"></div>
    <div id="modal-container"></div>

    <script src="assets/js/app.js?v=5.7"></script>
</body>
</html>
