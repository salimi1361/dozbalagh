<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سامانه هوشمند دوزوله</title>
    <link rel="manifest" href="manifest.json?v=4.0">
    <meta name="theme-color" content="#f8fafc">
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: 700;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/fonts/webfonts/Vazirmatn-Black.woff2') format('woff2');
            font-weight: 900;
        }

        body { 
            font-family: 'Vazirmatn', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
        }
        
        .app-layout {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fafafa;
            position: relative;
        }

        /* منوی پایینی ثابت */
        .bottom-nav-bar {
            max-width: 480px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
        }

        /* پاپ‌آپ شیشه‌ای نصب */
        .blur-bg {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="text-slate-800 antialiased overflow-hidden">

    <div id="app" class="app-layout">
        
        <header class="px-5 py-4 flex justify-between items-center bg-white sticky top-0 z-40 border-b border-slate-100">
            <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-600 border border-slate-200">
                <i class="fa-regular fa-bell text-lg"></i>
            </div>
            <div class="flex flex-col text-center">
                <h1 class="font-black text-sm text-slate-900 tracking-tight">سامانه دوزوله</h1>
                <span class="text-slate-500 font-bold" style="font-size: 10px;">مدیریت هوشمند ناوگان</span>
            </div>
            <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md">
                <i class="fa-solid fa-truck-fast text-lg"></i>
            </div>
        </header>

        <main id="main-content" class="flex-1 overflow-y-auto px-5 py-5 pb-28">
            <div class="flex flex-col items-center justify-center py-20">
                <div class="animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
            </div>
        </main>

        <div class="fixed bottom-0 left-0 right-0 z-40 flex justify-center">
            <nav id="bottom-navigation" class="hidden w-full bg-white flex justify-between items-center px-2 pt-2 pb-4 bottom-nav-bar rounded-t-3xl">
                
                <button onclick="switchTab('profile')" id="tab-profile" class="flex-1 flex flex-col items-center text-slate-400 focus:outline-none transition">
                    <i class="fa-regular fa-user text-xl mb-1"></i>
                    <span class="font-bold text-xs">پروفایل</span>
                </button>

                <button onclick="switchTab('company')" id="tab-company" class="flex-1 flex flex-col items-center text-slate-400 focus:outline-none transition">
                    <i class="fa-solid fa-building-shield text-xl mb-1"></i>
                    <span class="font-bold text-xs">شرکت</span>
                </button>

                <div class="relative -top-8 px-2">
                    <button id="fab-trip-btn" onclick="toggleTripState()" class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-xl shadow-blue-600/40 text-2xl transform active:scale-95 transition-all border-4 border-white">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>

                <button onclick="switchTab('fleet')" id="tab-fleet" class="flex-1 flex flex-col items-center text-slate-400 focus:outline-none transition">
                    <i class="fa-solid fa-truck text-xl mb-1"></i>
                    <span class="font-bold text-xs">ناوگان</span>
                </button>

                <button onclick="switchTab('home')" id="tab-home" class="flex-1 flex flex-col items-center text-blue-600 focus:outline-none transition">
                    <i class="fa-solid fa-house text-xl mb-1"></i>
                    <span class="font-black text-xs">کارتابل</span>
                </button>

            </nav>
        </div>

        <div id="pwa-install-modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-end justify-center p-4 blur-bg">
            <div class="bg-white w-full max-w-md rounded-3xl p-6 space-y-6 shadow-2xl transform translate-y-0 transition-transform duration-300">
                <div class="flex items-center space-x-4 space-x-reverse">
                    <div class="w-14 h-14 bg-blue-50 text-blue-600 flex items-center justify-center rounded-2xl text-2xl border border-blue-100">
                        <i class="fa-solid fa-download"></i>
                    </div>
                    <div>
                        <h3 class="font-black text-slate-900 text-base">نصب اپلیکیشن دوزوله</h3>
                        <p class="text-xs text-slate-500 mt-1">جهت دسترسی به GPS و پایداری در جاده، نصب برنامه الزامی است.</p>
                    </div>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs text-slate-600 space-y-2">
                    <p class="font-bold text-blue-600"><i class="fa-solid fa-circle-info ml-1"></i> راهنمای نصب:</p>
                    <p>📱 <b>اندروید:</b> دکمه آبی زیر را لمس کنید.</p>
                    <p>🍏 <b>آیفون (iOS):</b> دکمه <i class="fa-solid fa-share-from-square text-blue-600 mx-1"></i> را زده و <b>Add to Home Screen</b> را انتخاب کنید.</p>
                </div>
                <button onclick="triggerPwaInstall()" class="w-full bg-blue-600 text-white font-black py-4 px-4 rounded-xl shadow-lg shadow-blue-600/30">
                    نصب و افزودن به صفحه گوشی
                </button>
            </div>
        </div>

    </div>

    <script src="assets/js/app.js?v=4.0"></script>
</body>
</html>
